name: Pharmacy report cash-count formal verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install model-checking tools
        run: |
          if ! curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output /tmp/tla2tools.jar; then
            curl --fail --location -H 'Accept: application/octet-stream' https://api.github.com/repos/tlaplus/tlaplus/releases/assets/184694200 --output /tmp/tla2tools.jar
          fi
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar' | sha256sum --check
      - name: Verify the cash-count protocol and its negative controls
        run: python3 verification/cr33-pharmacy-report/verify.py --jar /tmp/tla2tools.jar
