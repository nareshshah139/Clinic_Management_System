name: Appointment overbooking formal verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install model-checking tools
        run: |
          curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output /tmp/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar' | sha256sum --check
      - name: Verify the booking limit and its negative controls
        run: python3 verification/appointment-overbooking/verify.py --jar /tmp/tla2tools.jar
