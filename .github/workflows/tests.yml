name: CI - Backend and Frontend Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.x for cc-check
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Check code contract syntax and attachment
        run: npm run contracts:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: recovery_test
          POSTGRES_PASSWORD: recovery_test
          POSTGRES_DB: clinic_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery_test -d clinic_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install PDF regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: Install root deps
        run: npm ci

      - name: Build all workspaces and generate the backend client
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --ci --runInBand

      - name: Run all backend tests with recovery database coverage
        working-directory: backend
        env:
          PURCHASE_DELEGATION_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PURCHASE_AUTOMATION_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          INVENTORY_READ_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          OPENING_IMPORT_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PAYMENT_RECOVERY_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PARTNER_RECOVERY_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          VISIT_LIFECYCLE_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          INVENTORY_WORKFLOW_RECOVERY_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          INVENTORY_API_BOUNDARIES_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          APPOINTMENT_TOKEN_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PRIMARY_DOCTOR_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          DOCTOR_AVAILABILITY_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          CLINIC_INVESTIGATIONS_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PASSWORD_RESET_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          RESET_CODE_SCRIPT_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PATIENT_MERGE_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          INVOICE_NUMBERS_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          BILLING_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          REPORTS_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          QUEUE_COVERAGE_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          SALES_REGISTER_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PURCHASE_REGISTER_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PURCHASE_RETURNS_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          RECONCILIATION_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
          PHARMACY_REPORTS_TEST_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
        run: npm test -- --ci --runInBand

      - name: Prove the RBAC scripts are safe to rerun
        working-directory: backend
        env:
          RERUN_PROOF_DATABASE_URL: postgresql://recovery_test:recovery_test@127.0.0.1:5432/clinic_recovery
        run: ../node_modules/.bin/ts-node --transpile-only scripts/verify_rerun_safety.ts

      - name: Verify inventory state presentations and recovery proofs
        run: |
          python3 -m venv /tmp/inventory-proof
          /tmp/inventory-proof/bin/pip install z3-solver==5.3.1.0
          node verification/inventory-state-clarity-fix-2026-10-25/check_presentations.cjs
          /tmp/inventory-proof/bin/python verification/inventory-state-clarity-fix-2026-10-25/check_knowledge.py
          /tmp/inventory-proof/bin/python verification/inventory-state-clarity-fix-2026-10-25/check_model.py
          /tmp/inventory-proof/bin/python verification/queue-selling-unit-coverage-2026-11-06/check_coverage.py
          /tmp/inventory-proof/bin/python verification/cr33-pharmacy-report/check_money.py
